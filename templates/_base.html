{% load compress %}
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django + Tailwind CSS + Flowbite</title>

    
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
   

</head>

<body class="">

  <nav class="bg-blue-700 shadow-sm border-b border-gray-100 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo et Nom du Blog -->
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-gradient-to-r from-purple-500 to-pink-500 rounded-full"></div>
                    <a href="#" class="text-xl font-serif font-bold text-gray-900 hover:text-purple-600 transition duration-300">
                        Digital Inkwell
                    </a>
                </div>

                <!-- Menu Navigation Desktop -->
                <div class="hidden md:flex items-center space-x-8">
                    <a href="#" class="text-gray-700 hover:text-purple-600 font-medium transition duration-300 flex items-center space-x-1">
                        <span>📚</span>
                        <span>Articles</span>
                    </a>
                    <a href="#" class="text-gray-700 hover:text-purple-600 font-medium transition duration-300 flex items-center space-x-1">
                        <span>🏷️</span>
                        <span>Catégories</span>
                    </a>
                    <a href="#" class="text-gray-700 hover:text-purple-600 font-medium transition duration-300 flex items-center space-x-1">
                        <span>👨‍💻</span>
                        <span>Auteur</span>
                    </a>
                    <a href="#" class="text-gray-700 hover:text-purple-600 font-medium transition duration-300 flex items-center space-x-1">
                        <span>📖</span>
                        <span>À propos</span>
                    </a>
                </div>

                <!-- Actions Desktop -->
                <div class="hidden md:flex items-center space-x-4">
                    <!-- Barre de recherche -->
                    <div class="relative">
                        <input 
                            type="text" 
                            placeholder="Rechercher..." 
                            class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent text-sm w-48 transition duration-300"
                        >
                        <div class="absolute left-3 top-1/2 transform -translate-y-1/2">
                            <span class="text-gray-400">🔍</span>
                        </div>
                    </div>
                    
                    <!-- Bouton écrire un article -->
                    <a href="#" class="bg-gradient-to-r from-purple-500 to-pink-500 text-white px-4 py-2 rounded-lg font-medium hover:from-purple-600 hover:to-pink-600 transition duration-300 shadow-sm">
                        ✍️ Écrire
                    </a>
                </div>

                <!-- Bouton Menu Mobile -->
                <div class="md:hidden">
                    <button id="menu-toggle" class="text-gray-700 hover:text-purple-600 p-2 rounded-lg transition duration-300">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Menu Mobile -->
            <div id="mobile-menu" class="md:hidden hidden border-t border-gray-200 bg-white">
                <div class="px-2 pt-2 pb-3 space-y-1">
                    <a href="#" class="flex items-center space-x-3 text-gray-700 hover:text-purple-600 hover:bg-gray-50 px-3 py-2 rounded-lg transition duration-300">
                        <span>📚</span>
                        <span>Articles</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 text-gray-700 hover:text-purple-600 hover:bg-gray-50 px-3 py-2 rounded-lg transition duration-300">
                        <span>🏷️</span>
                        <span>Catégories</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 text-gray-700 hover:text-purple-600 hover:bg-gray-50 px-3 py-2 rounded-lg transition duration-300">
                        <span>👨‍💻</span>
                        <span>Auteur</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 text-gray-700 hover:text-purple-600 hover:bg-gray-50 px-3 py-2 rounded-lg transition duration-300">
                        <span>📖</span>
                        <span>À propos</span>
                    </a>
                    
                    <!-- Barre de recherche mobile -->
                    <div class="px-3 py-2">
                        <div class="relative">
                            <input 
                                type="text" 
                                placeholder="Rechercher..." 
                                class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent text-sm transition duration-300"
                            >
                            <div class="absolute left-3 top-1/2 transform -translate-y-1/2">
                                <span class="text-gray-400">🔍</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Bouton écrire mobile -->
                    <div class="px-3 py-2">
                        <a href="#" class="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white px-4 py-2 rounded-lg font-medium hover:from-purple-600 hover:to-pink-600 transition duration-300 shadow-sm block text-center">
                            ✍️ Écrire un article
                        </a>
                    </div>
                </div>
            </div>
        </div>
      </nav>

    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.1.2/dist/flowbite.min.js"></script>
    <section class="container mx-auto mt-4">
      {% block content %}

      {% endblock %}
    </section>
</body>

</html>
