{% extends '_base.html' %}

{% block content %}
<h2>Se connecter</h2>

{% if form.errors %}
    <p style="color: red;">Nom d'utilisateur ou mot de passe incorrect.</p>
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Se connecter</button>
</form>

<p>
    Pas encore de compte ?
    <a href="{% url 'register' %}">Créer un compte</a>
</p>
{% endblock %}
